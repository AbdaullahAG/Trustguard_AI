name: TrustGuard AI — CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Lint
        run: flake8 agents.py app.py --max-line-length=120 --ignore=E503,W504
      - name: Unit tests (no Azure API needed)
        run: pytest tests/test_local.py -v
        env:
          AZURE_ENDPOINT: https://placeholder.openai.azure.com/
          AZURE_API_KEY: placeholder
          DEPLOYMENT_NAME: gpt-5.4
